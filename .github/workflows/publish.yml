# Publishes @mku1tra/que-pasa on npm when a version tag `v<version>` is pushed: the same check set first, then
# `npm publish` by trusted publishing (OIDC), with no token and with provenance. The tag is the gate: a ruleset lets
# only an admin of the repo make a version tag. npmjs.com holds the other half: the package's Trusted Publisher names
# this repo and this file.
name: publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 has npm 10.
      - run: npm install --global npm@11.21.0
      - name: The tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: scripts/check.sh all
      # A version npm has already is left as it is: a run again, or the first version, published by hand.
      - name: Publish, if npm does not have this version
        run: |
          package=$(node -p 'require("./package.json").name')@$(node -p 'require("./package.json").version')
          if npm view "$package" version >/dev/null 2>&1; then
            echo "npm has $package already"
          else
            npm publish
          fi
